<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TalkAbout Sessions">
  <!-- The app's gauge, reduced to what survives at 16 pixels: four ticks,
       three lit. Enough to read as a measurement rather than a monogram. -->
  <rect width="32" height="32" rx="7" fill="#0b0a09"/>
  <g>
    <rect x="6"    y="8" width="3.6" height="16" rx="1.2" fill="#e0a63f"/>
    <rect x="12.1" y="8" width="3.6" height="16" rx="1.2" fill="#e0a63f"/>
    <rect x="18.2" y="8" width="3.6" height="16" rx="1.2" fill="#e0a63f"/>
    <rect x="24.3" y="8" width="3.6" height="16" rx="1.2" fill="#443c36"/>
  </g>
</svg>
